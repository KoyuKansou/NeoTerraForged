loom {
    accessWidenerPath = file("src/main/resources/reterraforged.accesswidener")
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    compileOnly "curse.maven:terrablender-fabric-565956:7834072"
    compileOnly "com.electronwill.night-config:toml:3.6.7"
}

repositories {
    maven { url "https://maven.glitchfiend.com/public" }
}
